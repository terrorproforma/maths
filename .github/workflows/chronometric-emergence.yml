name: Chronometric emergence verification

on:
  push:
    branches: [main]
    paths:
      - 'chronometric-emergence/**'
      - '.github/workflows/chronometric-emergence.yml'
  pull_request:
    paths:
      - 'chronometric-emergence/**'
      - '.github/workflows/chronometric-emergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chronometric-emergence
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: chronometric-emergence/requirements.txt

      - name: Install verification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run consolidated verification
        run: make verify

      - name: Confirm PASS result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('data/consolidated_verification_results.json').read_text())
          assert result['status'] == 'PASS', result
          assert result['summary']['checks'] == 32, result['summary']
          assert result['summary']['failed'] == 0, result['summary']
          print(result['summary'])
          PY
