name: Verify result packages

on:
  push:
    branches:
      - main
    paths:
      - "chairman-counterexample/**"
      - "detector-chains/**"
      - "planar-cost-lower-bound/**"
      - ".github/workflows/result-packages.yml"
  pull_request:
    paths:
      - "chairman-counterexample/**"
      - "detector-chains/**"
      - "planar-cost-lower-bound/**"
      - ".github/workflows/result-packages.yml"

permissions:
  contents: read

jobs:
  chairman-certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MILP dependencies
        run: pip install numpy scipy
      - name: Exact certificate (11x15 instance)
        working-directory: chairman-counterexample/code
        run: |
          python3 verify_chairman.py
          python3 verify_chairman_certificate.py
      - name: Independent MILP check (11x15)
        working-directory: chairman-counterexample/code
        run: python3 verify_chairman_milp.py
      - name: Exact certificate (7/6 strengthening and 9/8 instance)
        working-directory: chairman-counterexample/code
        run: python3 verify_stronger_bound.py
      - name: Exact certificate (improved split, 4-2*sqrt(2))
        working-directory: chairman-counterexample/code
        run: python3 verify_improved_split.py
      - name: Independent MILP check (49x72 at budget 9/8)
        working-directory: chairman-counterexample/code
        run: python3 verify_stronger_milp.py

  detector-chain-certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MILP dependencies
        run: pip install numpy scipy
      - name: Exact chain-block certificates (all depths)
        working-directory: detector-chains/code
        run: python3 verify_chain_certificate.py
      - name: Exact full-instance bounds (7 rungs, to depth 40)
        working-directory: detector-chains/code
        run: python3 verify_kappa_certificate.py
      - name: Split-optimality (exact counterexample and LP separation)
        working-directory: detector-chains/code
        run: python3 verify_split_optimality.py
      - name: Exhaustive block-game claims (stdlib only, no solver)
        working-directory: detector-chains/code
        run: python3 verify_block_games.py
      - name: Composition-failure witness (exact schedule replay)
        working-directory: detector-chains/code
        run: python3 verify_composition_failure.py
      - name: Independent MILP check (119x236 beats 7/6)
        working-directory: detector-chains/code
        run: python3 beat_76_instance.py

  planar-cost-certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaustive DGG certificate (Rybin instance)
        working-directory: planar-cost-lower-bound/code
        run: python3 verify_dgg.py
      - name: Parametric family enumeration (9/8 supremum, denominator cap 12)
        working-directory: planar-cost-lower-bound/code
        run: python3 search_dgg_family.py 12

  build-manuscripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Compile chairman manuscript and arXiv package
        working-directory: chairman-counterexample
        run: make arxiv
      - name: Compile detector-chains manuscript
        working-directory: detector-chains
        run: make paper
      - name: Compile planar-cost manuscript
        working-directory: planar-cost-lower-bound/paper
        run: latexmk -pdf -interaction=nonstopmode planar_cost_lower_bound.tex
      - name: Upload compiled manuscripts
        uses: actions/upload-artifact@v4
        with:
          name: result-package-manuscripts
          path: |
            chairman-counterexample/paper/chairman_counterexample.pdf
            chairman-counterexample/arxiv-upload/chairman_counterexample.pdf
            detector-chains/paper/kappa_chains.pdf
            planar-cost-lower-bound/paper/planar_cost_lower_bound.pdf
          if-no-files-found: error
