name: Rebuild chronometric response history

on:
  push:
    branches:
      - chronometric-response-history
    paths:
      - 'chronometric-emergence/tools/rebuild_response_history.py'
      - '.github/workflows/rebuild-chronometric-response-history.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'chronometric-emergence/tools/rebuild_response_history.py'
      - '.github/workflows/rebuild-chronometric-response-history.yml'
      - 'chronometric-emergence/working/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out response-history branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib

      - name: Rebuild complete response history
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          python chronometric-emergence/tools/rebuild_response_history.py

      - name: Verify response-by-response hierarchy
        shell: bash
        run: |
          set -euo pipefail
          count=$(find chronometric-emergence/working -maxdepth 1 -type d -name '[0-9][0-9]-v*' | wc -l)
          test "$count" -eq 18
          test -f chronometric-emergence/working/01-v0.1-chronometry-from-crossed-null-phases/chronometry_from_crossed_null_phases.tex
          test -f chronometric-emergence/working/02-v0.2-crossed-null-audit/crossed_null_chronometry_audit_v0_2.tex
          test -f chronometric-emergence/working/05-v0.5-qcd-chronometric-lock/qcd_chronometric_lock_v0_5.tex
          test -f chronometric-emergence/working/14-v1.4-direct-amy-transport/direct_amy_transport_v1_4.tex
          test -f chronometric-emergence/working/15-v1.5-electroweak-yukawa-lpm/electroweak_yukawa_lpm_v1_5.tex
          test -f chronometric-emergence/working/16-v1.6-hard-portal-retarded-kernel/chronometric_project_checkpoint_v1_6.tex
          test -f chronometric-emergence/working/16-v1.6-hard-portal-retarded-kernel/hard_portal_retarded_kernel_v1_6.tex
          test -f chronometric-emergence/working/17-v1.7-gauge-covariant-correlator-closure/gauge_covariant_correlator_closure_v1_7.tex
          test -f chronometric-emergence/working/18-v1.8-pre-hpc-closure/prehpc_closure_v1_8.tex
          test -f chronometric-emergence/working/ARTIFACT_LEDGER.csv
          test -f chronometric-emergence/chronometric_response_archive_complete.zip
          files=$(find chronometric-emergence/working -type f | wc -l)
          echo "Response folders: $count"
          echo "Files in working archive: $files"
          test "$files" -gt 200

      - name: Commit rebuilt archive
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'Angus Muffatti'
          git config user.email '130276587+terrorproforma@users.noreply.github.com'
          git add chronometric-emergence/working chronometric-emergence/chronometric_response_archive_complete.zip
          if git diff --cached --quiet; then
            echo 'No response-history changes to commit.'
            exit 0
          fi
          git commit -m 'Archive complete chronometric response history'
          git push origin HEAD:"${TARGET_BRANCH}"
