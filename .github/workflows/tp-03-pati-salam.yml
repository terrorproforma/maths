name: Restore and verify TP-03 Pati-Salam benchmark

on:
  push:
    branches:
      - main
      - tp03-phase2-vacuum-hessian
    paths:
      - "_bootstrap/tp03-phase2b/**"
      - ".github/workflows/tp-03-pati-salam.yml"
      - "theoretical-physics-program/README.md"
      - "theoretical-physics-program/tp-03-pati-salam-benchmark/**"

permissions:
  contents: write

concurrency:
  group: tp03-phase2b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore TP-03 Phase 2B source package
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "_bootstrap/tp03-phase2b/part-*.b64" > /dev/null; then
            cat _bootstrap/tp03-phase2b/part-*.b64 | base64 --decode > /tmp/tp03_phase2b_root.tar.xz
            echo "438da989ebaad4e2215a4675f7f42620c156698cb24fad729fb52afabbcfe6f3  /tmp/tp03_phase2b_root.tar.xz" | sha256sum -c -
            tar -xJf /tmp/tp03_phase2b_root.tar.xz -C .
            rm -rf _bootstrap/tp03-phase2b
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r theoretical-physics-program/tp-03-pati-salam-benchmark/requirements.txt

      - name: Verify invariant basis, vacuum and spectra
        working-directory: theoretical-physics-program/tp-03-pati-salam-benchmark
        shell: bash
        run: make verify

      - name: Commit restored research package
        if: steps.restore.outputs.restored == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            theoretical-physics-program/README.md \
            theoretical-physics-program/tp-03-pati-salam-benchmark \
            _bootstrap/tp03-phase2b
          if ! git diff --cached --quiet; then
            git commit -m "Restore TP-03 Phase 2B research package"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
