name: Chronometric frontier repair v2

# Executed repair branch; generated evidence is committed back only after all fallible gates pass.
on:
  push:
    paths:
      - '_bootstrap/frontier_repair_v2.tar.xz'
      - '.github/workflows/chronometric-frontier-repair-v2.yml'
  pull_request:
    paths:
      - '_bootstrap/frontier_repair_v2.tar.xz'
      - '.github/workflows/chronometric-frontier-repair-v2.yml'
      - 'chronometric-emergence/frontier-repair-v2/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct repair package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf chronometric-emergence/frontier-repair-v2
          mkdir -p chronometric-emergence
          tar -xJf _bootstrap/frontier_repair_v2.tar.xz -C chronometric-emergence

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: chronometric-emergence/frontier-repair-v2/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e chronometric-emergence/frontier-repair-v2
          python -m pip check

      - name: Execute objective repair suite including full v1.5 recomputation
        env:
          MPLBACKEND: Agg
        run: |
          python -m frontier_repair.run_all \
            --repo-root "$GITHUB_WORKSPACE" \
            --package-root "$GITHUB_WORKSPACE/chronometric-emergence/frontier-repair-v2" \
            --expensive | tee chronometric-emergence/frontier-repair-v2/results/release_run.log

      - name: Run tests
        run: |
          cd chronometric-emergence/frontier-repair-v2
          pytest -q | tee results/pytest_output.txt

      - name: Regenerate portable checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd chronometric-emergence/frontier-repair-v2
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Commit generated repair evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Angus Muffatti'
          git config user.email '130276587+terrorproforma@users.noreply.github.com'
          git add chronometric-emergence/frontier-repair-v2
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Execute chronometric frontier repair v2 [frontier-repair-generated]'
            git push origin HEAD:"$TARGET_BRANCH"
          fi
