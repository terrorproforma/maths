name: Chronometric frontier evidence v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'chronometric-emergence/frontier-evidence-v2/src/**'
      - 'chronometric-emergence/frontier-evidence-v2/tests/**'
      - 'chronometric-emergence/frontier-evidence-v2/tools/**'
      - 'chronometric-emergence/frontier-evidence-v2/pyproject.toml'
      - 'chronometric-emergence/frontier-evidence-v2/Makefile'
      - '.github/workflows/chronometric-frontier-repair-v2.yml'
  pull_request:
    paths:
      - 'chronometric-emergence/frontier-evidence-v2/src/**'
      - 'chronometric-emergence/frontier-evidence-v2/tests/**'
      - 'chronometric-emergence/frontier-evidence-v2/tools/**'
      - 'chronometric-emergence/frontier-evidence-v2/pyproject.toml'
      - 'chronometric-emergence/frontier-evidence-v2/Makefile'
      - '.github/workflows/chronometric-frontier-repair-v2.yml'

permissions:
  contents: write

concurrency:
  group: chronometric-frontier-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
      MPLBACKEND: Agg
    steps:
      - name: Check out current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: chronometric-emergence/frontier-evidence-v2/pyproject.toml

      - name: Install declared dependencies
        working-directory: chronometric-emergence/frontier-evidence-v2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip check

      - name: Apply strict migration repairs
        working-directory: chronometric-emergence/frontier-evidence-v2
        run: python tools/apply_ci_repairs.py

      - name: Run fallible tests and regenerate evidence
        working-directory: chronometric-emergence/frontier-evidence-v2
        run: make full

      - name: Commit repaired source and generated evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Angus Muffatti'
          git config user.email '130276587+terrorproforma@users.noreply.github.com'
          git add \
            chronometric-emergence/frontier-evidence-v2/src/frontier_evidence/scalar_two_time.py \
            chronometric-emergence/frontier-evidence-v2/results \
            chronometric-emergence/frontier-evidence-v2/docs/FRONTIER_EVIDENCE_REPORT.md
          if git diff --cached --quiet; then
            echo 'Repaired source and generated evidence are already current.'
          else
            git commit -m 'Repair and regenerate chronometric frontier evidence v2 [skip ci]'
            git push origin HEAD:"$TARGET_BRANCH"
          fi
