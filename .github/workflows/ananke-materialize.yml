name: Materialize ANANKE research history

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".ananke-bootstrap/**"
      - ".github/workflows/ananke-materialize.yml"

permissions:
  contents: write

concurrency:
  group: ananke-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct and run the checksum-pinned materializer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.24'
          cat .ananke-bootstrap/materialize/part-* > /tmp/ananke-materialize.sh
          echo "ded83dc0807c093f50677b33c150547c8894a7caf6027f79c1cf80ae22271959  /tmp/ananke-materialize.sh" | sha256sum -c -
          chmod +x /tmp/ananke-materialize.sh
          /tmp/ananke-materialize.sh
