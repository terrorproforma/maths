name: Unpack chronometric research payload

on:
  push:
    branches:
      - main
      - populate-chronometric-emergence-v1-8
    paths:
      - '_bootstrap/chronometric_payload.part.*'
      - '.github/workflows/unpack-chronometric-payload.yml'
      - '_bootstrap/TRIGGER'
  pull_request:
    branches:
      - main
    paths:
      - '_bootstrap/chronometric_payload.part.*'
      - '.github/workflows/unpack-chronometric-payload.yml'
      - '_bootstrap/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct and extract payload
        shell: bash
        run: |
          set -euo pipefail
          test -f _bootstrap/chronometric_payload.part.00
          cat _bootstrap/chronometric_payload.part.* | base64 --decode > /tmp/chronometric_payload.tar.xz
          xz --test /tmp/chronometric_payload.tar.xz
          mkdir -p /tmp/chronometric_payload
          tar -xJf /tmp/chronometric_payload.tar.xz -C /tmp/chronometric_payload
          echo 'Extracted payload:'
          find /tmp/chronometric_payload -maxdepth 5 -type f -print | sort

          mkdir -p chronometric-emergence
          if [ -d /tmp/chronometric_payload/chronometric-emergence ]; then
            rsync -a /tmp/chronometric_payload/chronometric-emergence/ chronometric-emergence/
          elif [ -d /tmp/chronometric_payload/chronometric_emergence_full_package ]; then
            rsync -a /tmp/chronometric_payload/chronometric_emergence_full_package/ chronometric-emergence/
          else
            rsync -a /tmp/chronometric_payload/ chronometric-emergence/
          fi

          rm -rf _bootstrap

      - name: Enforce Angus Muffatti authorship in source metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('chronometric-emergence')
          replacements = {
              'author: "Chronometric Emergence Project"': 'author: "Angus Muffatti"',
              'author: Chronometric Emergence Project': 'author: Angus Muffatti',
              '\\author{Chronometric Emergence Project}': '\\author{Angus Muffatti}',
              'pdfauthor={Chronometric Emergence Project}': 'pdfauthor={Angus Muffatti}',
          }
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.md', '.tex', '.bib', '.txt', '.yaml', '.yml', '.json', '.csv', '.py'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if path.name == 'README.md' and 'Angus Muffatti' not in text:
                  text = text.replace('\n', '\n\n**Author: Angus Muffatti**\n', 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Add complete project manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Repository file manifest'
            echo
            echo '**Author: Angus Muffatti**'
            echo
            echo 'Generated automatically from the complete uploaded research payload.'
            echo
            echo '```text'
            find chronometric-emergence -type f -print | sort
            echo '```'
          } > chronometric-emergence/FILE_MANIFEST.md

      - name: Commit extracted project
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'Angus Muffatti'
          git config user.email '130276587+terrorproforma@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Publish complete chronometric emergence research project'
          git push origin HEAD:"${TARGET_BRANCH}"
