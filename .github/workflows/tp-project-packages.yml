name: Restore and verify TP-00 and TP-01

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "_bootstrap/tp00/**"
      - ".github/workflows/tp-project-packages.yml"
      - "theoretical-physics-program/tp-00-gr-sm-frontier-model/**"
      - "theoretical-physics-program/tp-01-common-geometric-parent/**"

permissions:
  contents: write

concurrency:
  group: tp-project-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete TP-00 source archive
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "_bootstrap/tp00/part-*.b64" > /dev/null; then
            cat _bootstrap/tp00/part-*.b64 | base64 --decode > /tmp/tp00_source.tar.xz
            echo "8a741792f7b993fd9657d11a32293f5dc150acad3a1d3120b249ce28700230f2  /tmp/tp00_source.tar.xz" | sha256sum -c -
            mkdir -p theoretical-physics-program
            tar -xJf /tmp/tp00_source.tar.xz -C theoretical-physics-program
            rm -rf _bootstrap/tp00
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit restored TP-00 sources
        if: steps.restore.outputs.restored == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A theoretical-physics-program/tp-00-gr-sm-frontier-model _bootstrap
          if ! git diff --cached --quiet; then
            git commit -m "Restore complete TP-00 reproducible source package"
            git push origin HEAD:main
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            theoretical-physics-program/tp-00-gr-sm-frontier-model/requirements.txt
            theoretical-physics-program/tp-01-common-geometric-parent/requirements.txt

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            biber \
            poppler-utils \
            qpdf \
            zip

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy scipy sympy matplotlib pandas pyyaml \
            jupyter nbconvert nbformat pytest Pillow
          python -m pip install -r theoretical-physics-program/tp-00-gr-sm-frontier-model/requirements.txt
          python -m pip install -r theoretical-physics-program/tp-01-common-geometric-parent/requirements.txt

      - name: Build and verify TP-00
        working-directory: theoretical-physics-program/tp-00-gr-sm-frontier-model
        shell: bash
        run: make all

      - name: Build and verify TP-01 v1.1
        working-directory: theoretical-physics-program/tp-01-common-geometric-parent
        shell: bash
        run: make all

      - name: Create deterministic project archives
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import zipfile
          from pathlib import Path

          projects = [
              (Path("theoretical-physics-program/tp-00-gr-sm-frontier-model"), "TP-00_GR_SM_frontier_model_v1.0.zip"),
              (Path("theoretical-physics-program/tp-01-common-geometric-parent"), "TP-01_common_geometric_parent_v1.1.zip"),
          ]
          excluded_suffixes = {
              ".aux", ".bbl", ".bcf", ".blg", ".fdb_latexmk", ".fls",
              ".log", ".out", ".run.xml", ".synctex.gz", ".toc",
          }
          excluded_dirs = {".git", "__pycache__", ".pytest_cache", "dist"}
          epoch = (1980, 1, 1, 0, 0, 0)

          for root, archive_name in projects:
              dist = root / "dist"
              dist.mkdir(parents=True, exist_ok=True)
              archive = dist / archive_name
              files: list[Path] = []
              for path in root.rglob("*"):
                  rel = path.relative_to(root)
                  if path.is_dir():
                      continue
                  if any(part in excluded_dirs for part in rel.parts):
                      continue
                  if any(path.name.endswith(suffix) for suffix in excluded_suffixes):
                      continue
                  files.append(path)

              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for path in sorted(files, key=lambda p: p.as_posix()):
                      rel = path.relative_to(root)
                      info = zipfile.ZipInfo((Path(root.name) / rel).as_posix(), epoch)
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = (0o755 if os.access(path, os.X_OK) else 0o644) << 16
                      zf.writestr(info, path.read_bytes())
              print(f"created {archive} ({archive.stat().st_size} bytes)")
          PY

      - name: Commit generated papers, figures, results, and archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find theoretical-physics-program/tp-00-gr-sm-frontier-model \
            -type f \( \
              -name '*.pdf' -o -name '*.png' -o -name '*.npz' -o \
              -name 'manifest_sha256.csv' -o -path '*/results/*' -o \
              -path '*/tables/*.tex' -o -path '*/dist/*.zip' \
            \) -print0 | xargs -0 -r git add -f --

          find theoretical-physics-program/tp-01-common-geometric-parent \
            -type f \( \
              -name '*.pdf' -o -name '*.png' -o -name '*.npz' -o \
              -name '*.ipynb' -o -name 'manifest_sha256.csv' -o \
              -path '*/results/*' -o -path '*/dist/*.zip' -o \
              -name 'tp01_dirac_brst_global_audit_v1_1.tex' \
            \) -print0 | xargs -0 -r git add -f --

          if ! git diff --cached --quiet; then
            git commit -m "Build and verify TP-00 and TP-01 research packages"
            git push origin HEAD:main
          fi
