schema_version: 1
project: bns-black-hole-jet-replication
target:
  paper:
    title: Jet from Binary Neutron Star Merger with Prompt Black Hole Formation
    authors:
      - Kota Hayashi
      - Kenta Kiuchi
      - Koutarou Kyutoku
      - Yuichiro Sekiguchi
      - Masaru Shibata
    journal: Physical Review Letters
    volume: 134
    article: 211407
    year: 2025
    doi: 10.1103/PhysRevLett.134.211407
    arxiv: 2410.10958

status_vocabulary:
  exact_artifact: Value is read from or represented by an immutable source artifact.
  paper_confirmed: Value is explicitly stated in the paper or supplement but exact input bytes remain unavailable.
  movie_recovered: Value was recovered from the supplied movie and is not a solver input.
  inferred: Value is a reasoned inference and must not silently enter a production input deck.
  unresolved: Exact value or artifact has not yet been obtained.

