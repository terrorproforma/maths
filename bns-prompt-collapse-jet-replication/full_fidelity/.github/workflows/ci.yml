name: full-fidelity-replication-ci

on:
  push:
    paths:
      - 'bns-prompt-collapse-jet-replication/full_fidelity/**'
  pull_request:
    paths:
      - 'bns-prompt-collapse-jet-replication/full_fidelity/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e 'bns-prompt-collapse-jet-replication/full_fidelity[test]'
      - working-directory: bns-prompt-collapse-jet-replication/full_fidelity
        run: pytest
      - working-directory: bns-prompt-collapse-jet-replication/full_fidelity
        run: ruff check src tests
