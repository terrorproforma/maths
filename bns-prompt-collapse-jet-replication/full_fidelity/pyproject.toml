[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bnsjet-replication"
version = "0.1.0"
description = "Reproducible campaign control and validation for a prompt-collapse BNS black-hole jet simulation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "terrorproforma/maths contributors"}]
dependencies = [
  "h5py>=3.11",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "numpy>=2.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
render = ["matplotlib>=3.9"]
test = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
bnsjet = "bnsjet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bnsjet"]
