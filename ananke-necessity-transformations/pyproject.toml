[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{ name = "Angus Muffatti" }]
name = "ananke-core"
version = "0.2.0"
description = "Representation-invariant process extraction, finite-shot inference, and stochastic realization obstructions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
