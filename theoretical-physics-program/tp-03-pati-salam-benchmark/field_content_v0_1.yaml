schema_version: 1.0.0
project: TP-03 complete Pati-Salam benchmark
author: Angus Muffatti
active_branch: PS1

gauge_group:
  local: SU(4)_C x SU(2)_L x SU(2)_R
  global_form: open
  hypercharge: Y = T3_R + (B-L)/2

fermions_per_generation:
  F_L:
    representation: [4, 2, 1]
    chirality: left
  F_R_c:
    representation: [bar4, 1, 2]
    chirality: left
  generations: 3

scalars:
  Phi_1:
    representation: [1, 2, 2]
    role: SU(4)-singlet Dirac masses
  Phi_15:
    representation: [15, 2, 2]
    role: quark-lepton Clebsch splitting
  Delta_R:
    representation: [10, 1, 3]
    role:
      - Pati-Salam breaking
      - right-handed Majorana masses
    neutral_direction:
      SU3: 1
      B_minus_L: -2
      T3_R: 1
      Y: 0

yukawa_structure:
  M_d: A_d + B_d
  M_e: A_d - 3 B_d
  M_u: A_u + B_u
  M_D_nu: A_u - 3 B_u
  M_R: f_R v_R
  light_neutrino: -M_D_nu M_R^{-1} M_D_nu^T

rejected_branch:
  id: PS0
  omitted_field: Phi_15
  fatal_relations:
    - M_d = M_e
    - M_u = M_D_nu
  fatal_gate: REC-03

open_data:
  - global gauge group
  - complete scalar potential
  - vacuum and spectrum
  - threshold matching
  - fermion fit
  - anomaly/cobordism checks for chosen global form
  - proton and nucleon stability
  - baryogenesis and defect history
