[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronometric-hpc-preflight"
version = "1.8.0"
description = "Preflight and regression harness for the PT/BFM-constrained chronometric 3PI/KB calculation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
